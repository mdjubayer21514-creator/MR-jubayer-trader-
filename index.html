<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR JUBAYER TRADER</title>
<style>
body{margin:0;background:#070b17;color:#fff;font-family:Arial;text-align:center;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#101426;border-radius:25px;padding:30px 20px;width:320px;box-shadow:0 0 30px #00ff8830}
.pic{width:140px;height:140px;border-radius:50%;border:4px solid #00ff88;box-shadow:0 0 20px #00ff88;margin:0 auto;object-fit:cover}
h2{color:#00ff88;margin:15px 0 5px 0}
.sub{color:#888;font-size:13px}
.price{background:#070b17;border-radius:12px;padding:14px;margin:20px 0;font-size:20px}
.btn{background:#00ff88;color:#000;border:none;padding:16px;border-radius:12px;width:100%;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<div class="card">
<img src="profile.jpg" class="pic">
<h2>MR JUBAYER TRADER</h2>
<p class="sub">Premium Trading Education</p>
<div class="price" id="price">EUR/USD: 1.0811 LIVE</div>
<p style="color:#00ff88;font-weight:bold;margin-bottom:25px">Live Market Viewer</p>
<button class="btn" onclick="window.open('https://www.tradingview.com/symbols/EURUSD/','_blank')">VIEW LIVE CHART</button>
<p style="color:#555;font-size:10px;margin-top:20px">Educational Only - No Trading Signals</p>
</div>
</body>
</html>
