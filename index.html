<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR JUBAYER TRADER - Live</title>
<style>
body{margin:0;background:#070b17;color:#fff;font-family:Arial;text-align:center}
.header{padding:20px}
.logo{width:90px;height:90px;border-radius:50%;border:3px solid #00ff88;background:#151a2b;margin:auto;display:flex;align-items:center;justify-content:center;font-size:36px;color:#00ff88}
h1{color:#00ff88;margin:10px 0 0 0;font-size:22px}
.card{background:#11162a;border:1px solid #00ff8820;border-radius:18px;max-width:380px;margin:15px auto;padding:18px}
.timer{font-size:48px;color:#00ff88;font-weight:bold}
.btn{background:#00ff88;color:#000;border:none;padding:14px 20px;border-radius:30px;width:100%;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
select{width:100%;padding:12px;border-radius:12px;background:#070b17;color:#fff;border:1px solid #333;margin-bottom:10px}
.warn{color:#666;font-size:11px;margin-top:15px}
</style>
</head>
<body>
<div class="header">
<div class="logo">MJ</div>
<h1>MR JUBAYER TRADER</h1>
<p style="color:#888;font-size:13px">Live Market - 15s Timer (Educational)</p>
</div>

<div class="card">
<select id="pair">
<option>FX:EURUSD</option>
<option>FX:USDJPY</option>
<option>FX:GBPUSD</option>
<option>FX:USDINR</option>
<option>FX:USDBDT</option>
</select>

<!-- TradingView Widget -->
<div id="tv" style="height:300px;border-radius:12px;overflow:hidden;margin:10px 0"></div>

<div class="timer" id="timer">15</div>
<button class="btn" onclick="startTimer()">START 15s TIMER</button>
<p id="status" style="color:#00ff88;font-size:13px;margin-top:10px">Ready for analysis</p>
<p class="warn">⚠️ Educational Only. No BUY/SELL Signal. Trading is risky. Do your own research.</p>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
let widget;
function loadChart(){
  document.getElementById('tv').innerHTML='';
  new TradingView.widget({
    "autosize": true,
    "symbol": document.getElementById('pair').value,
    "interval": "1",
    "timezone": "Asia/Dhaka",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "container_id": "tv"
  });
}
document.getElementById('pair').addEventListener('change', loadChart);
loadChart();

let t=15, interval=null;
function startTimer(){
  if(interval) return;
  t=15;
  document.getElementById('status').innerText="15s Analysis Window Running...";
  interval=setInterval(()=>{
    document.getElementById('timer').innerText=t;
    t--;
    if(t<0){
      clearInterval(interval); interval=null;
      document.getElementById('timer').innerText="15";
      document.getElementById('status').innerText="Time Over - Analyze Next Candle";
    }
  },1000);
}
</script>
</body>
</html>
