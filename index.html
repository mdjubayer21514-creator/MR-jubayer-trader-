<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR JUBAYER PREMIUM BOT</title>
<style>
body{margin:0;background:#080808;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial;}
.card{width:90%;max-width:380px;background:#141414;border:2px solid #FFD700;border-radius:20px;padding:25px;text-align:center;box-shadow:0 0 20px rgba(255,215,0,0.3);}
h1{color:#FFD700;font-size:22px;margin:0;} .badge{background:#FFD700;color:#000;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:900;}
input{width:100%;padding:14px;border-radius:10px;border:none;background:#222;color:#fff;text-align:center;font-size:20px;box-sizing:border-box;margin:15px 0;}
button{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(90deg,#FFD700,#FFA500);color:#000;font-weight:900;font-size:18px;cursor:pointer;}
#msg{margin-top:15px;font-weight:bold;font-size:20px;}
#signal{margin-top:20px;display:none;}
.signal-buy{color:#00ff88;font-size:32px;font-weight:900;}
.signal-sell{color:#ff0040;font-size:32px;font-weight:900;}
.timer{font-size:40px;color:#FFD700;}
</style>
</head>
<body>
<div class="card">
<h1>MR JUBAYER TRADER</h1>
<span class="badge">PREMIUM 5 SEC BOT</span>
<p style="color:#aaa;margin-top:15px">BOT VERIFICATION</p>
<input type="text" id="myPass" placeholder="Enter Password">
<button id="myBtn">UNLOCK PREMIUM BOT</button>
<div id="msg"></div>
<div id="signal"></div>
</div>

<script>
document.getElementById("myBtn").addEventListener("click", function(){
  var p = document.getElementById("myPass").value.trim();
  var msg = document.getElementById("msg");
  var signalDiv = document.getElementById("signal");
  
  if(p === "jubayer2151"){
    var s = 5;
    msg.innerHTML = '<div class="timer">'+s+'</div> sec... Unlocking Premium';
    signalDiv.style.display = "none";
    
    var timer = setInterval(function(){
      s--;
      if(s > 0){
        msg.innerHTML = '<div class="timer">'+s+'</div> sec... Unlocking Premium';
      } else {
        clearInterval(timer);
        msg.innerHTML = "SUCCESS! Bot Started ✅";
        
        // 5 second signal logic
        signalDiv.style.display = "block";
        signalDiv.innerHTML = "Analyzing Market...";
        
        setTimeout(function(){
          let isBuy = Math.random() > 0.5;
          if(isBuy){
            signalDiv.innerHTML = '<div class="signal-buy">⬆ BUY NOW</div><p style="font-size:14px">5 Sec Trade</p>';
          } else {
            signalDiv.innerHTML = '<div class="signal-sell">⬇ SELL NOW</div><p style="font-size:14px">5 Sec Trade</p>';
          }
        }, 1500);
      }
    }, 1000);
  } else {
    alert("Wrong Password! Correct: jubayer2151");
  }
});
</script>
</body>
</html>
