<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR JUBAYER TRADER - 1 minit AI BOT</title>
<style>
  body{background:#070b18;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:Arial;color:white}
  .card{background:#131a2e;width:365px;border-radius:28px;padding:28px 22px;text-align:center;border:1px solid rgba(0,255,120,0.3);box-shadow:0 0 50px rgba(0,255,120,0.2)}
  .circle{width:190px;height:190px;margin:0 auto 20px;border-radius:50%;border:3px solid #00ff7f;box-shadow:0 0 30px #00ff7f;background:#0f1428;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#5cff5c;line-height:1.2}
  .title{color:#4cff4c;font-size:32px;font-weight:900;line-height:1.1}
  .signal-box{margin:22px 0;background:rgba(0,0,0,0.3);border-radius:18px;padding:18px}
  .signal{font-size:60px;font-weight:900;margin:0} .put{color:#ff3b3b} .call{color:#00ff7f}
  .sub{color:#a0a8c0;font-size:15px;margin-top:5px}
  .timer{font-size:50px;font-weight:900;color:#00ff7f;margin:10px 0}
  .bar{height:6px;background:#1c2340;border-radius:10px;overflow:hidden;margin-bottom:18px}
  .fill{height:100%;background:#00ff7f;width:100%;transition:width 1s linear}
  .btn{background:#00ff7f;color:#000;border:none;width:100%;padding:18px;border-radius:16px;font-size:20px;font-weight:900;cursor:pointer;margin-bottom:12px}
  .tg-btn{background:#229ED9;color:white;border:none;width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none;display:block;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="circle">MR JUBAYER<br>TRADER</div>
  <div class="title">MR JUBAYER<br>TRADER</div>
  <div class="signal-box">
    <div id="signalText" class="signal put">PUT</div>
    <div id="arrow" style="font-size:42px">📉</div>
    <div id="marketText" class="sub">Market DOWN - Next Candle</div>
  </div>
  <div class="timer" id="timer">15</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <button class="btn" onclick="generateSignal()">GET SIGNAL NOW</button>
  <a href="https://t.me/JubayerTradingOfficial" target="_blank" class="tg-btn">✈️ JOIN TELEGRAM</a>
  <div style="margin-top:12px;font-size:11px;color:#6b7280">t.me/JubayerTradingOfficial • Live 1 
    minit Bot</div>
</div>
<script>
let count=15, interval;
function generateSignal(){
  const isPut=Math.random()>0.5;
  document.getElementById('signalText').textContent=isPut?"PUT":"CALL";
  document.getElementById('signalText').className=isPut?"signal put":"signal call";
  document.getElementById('marketText').textContent=isPut?"Market DOWN - Next Candle":"Market UP - Next Candle";
  document.getElementById('arrow').textContent=isPut?"📉":"📈";
  resetTimer();
}
function resetTimer(){count=15;clearInterval(interval);startTimer();}
function startTimer(){
  interval=setInterval(()=>{
    count--;
    document.getElementById('timer').textContent=count;
    document.getElementById('fill').style.width=(count/15*100)+"%";
    if(count<=0)generateSignal();
  },1000);
}
generateSignal();startTimer();
</script>
</body>
</html>
