<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JUBAYER BOT</title>
<style>
body{background:#0a0e1a;color:#fff;text-align:center;font-family:Arial;padding:15px}
.box{background:#151a2d;padding:25px;border-radius:20px;max-width:380px;margin:30px auto;border:1px solid #1f2d5a;box-shadow:0 0 30px #0a1930}
.logo{width:185px;height:185px;border-radius:50%;border:3px solid #f0c75e;box-shadow:0 0 25px #f0c75e55;object-fit:cover;margin:20px auto 0;display:block;background:#0a1930}

<div class="box" id="loginBox">

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUBAYER TRADING BOT</title>
<style>
body{background:#0a0e1a;color:#fff;font-family:Arial;text-align:center;padding:15px;margin:0}
.login-box,.card{background:#151a2d;padding:25px;border-radius:18px;max-width:380px;margin:30px auto;box-shadow:0 0 30px #00ff8840;border:1px solid #1f2947}
.logo{width:160px;height:160px;border-radius:50%;border:3px solid #00ff88;margin:0 auto 15px;display:block;box-shadow:0 0 25px #00ff8866;object-fit:cover}
h1,h2{color:#00ff88;margin:10px 0}
.signal{font-size:50px;margin:20px 0;font-weight:bold;min-height:60px}
button{background:#00ff88;color:#000;border:none;padding:14px;width:100%;border-radius:12px;font-weight:bold;font-size:18px;cursor:pointer;margin-top:12px}
input{width:88%;padding:14px;border-radius:10px;border:none;text-align:center;font-size:16px;margin:10px 0}
#mainCard{display:none}
#err{color:#ff4444;display:none;margin-top:10px}
#text{color:#aaa;margin:10px}
</style>
</head>
<body>

<div class="login-box" id="loginBox">
<img src="logo.png" class="logo" alt="Jubayer Logo">
<h2>JUBAYER TRADING</h2>
<p>Enter Password to Access</p>
<input type="password" id="pass" placeholder="Password">
<button onclick="checkPass()">UNLOCK BOT</button>
<p id="err">Wrong Password!</p>
</div>

<div class="card" id="mainCard">
<img src="logo.png" class="logo" alt="Jubayer Logo">
<h1>MR JUBAYER TRADER</h1>
<div class="signal" id="signal">-</div>
<div id="text">Waiting for 55s...</div>
<button onclick="generate()">GET SIGNAL NOW</button>
</div>

<script>
function checkPass(){
  const p = document.getElementById('pass').value;
  if(p === "jubayer2151"){
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('mainCard').style.display = 'block';
  } else {
    document.getElementById('err').style.display = 'block';
  }
}
function generate(){
  document.getElementById('text').innerText = 'Analyzing...';
  document.getElementById('signal').innerText = '⌛';
  setTimeout(()=>{
    let s = Math.random() > 0.5 ? 'CALL 📈' : 'PUT 📉';
    let el = document.getElementById('signal');
    el.innerText = s;
    el.style.color = s.includes('CALL') ? '#00ff88' : '#ff4444';
    document.getElementById('text').innerText = s.includes('CALL') ? 'Market UP - Next Candle' : 'Market DOWN - Next Candle';
  }, 800);
}
setInterval(()=>{
  let sec = new Date().getSeconds();
  if(sec === 55 && document.getElementById('mainCard').style.display === 'block'){
    generate();
  }
}, 1000);
</script>

</body>
</html>
